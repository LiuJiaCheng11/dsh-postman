# dsh-postman bundle patch: contributes this plugin row into the host
# composition when the package is installed via `dsh plugin --profile web add`.
#
# HOST-PLANE plugin: it reads host services (tools, webServer, connection) and
# registers model-facing `postman_*` tools, a runtime `postman-skill`, and a
# small HTTP fallback page. It must therefore land in the host composition
# (this insert), never inside an agent preset.
#
# `name` must be the package's real name — the loader imports this specifier.
#
# The Postman API Key is NOT set here. The plugin exports a `Config` schema
# (see src/index.js), so dsh renders a form for it under
#   Settings → postman
# and writes the value into the profile's user layer; `apiKey` is marked
# role('secret') so the value never rides back to the browser.
#
# Fallback order when that field is empty (handled in src/postman-api.js):
#   ~/.dsh/dsh-postman/config.json  →  ~/.postman_api_key  →  POSTMAN_API_KEY env

- insert:
    - id: dsh-postman
      name: 'dsh-postman'
